apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-redis
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/beksultanccc/java-redis-gitops.git
    targetRevision: HEAD
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true